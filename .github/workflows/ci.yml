name: CI

on:
  push:
    branches:
      - develop
      - "release/**"
      - "hotfix/**"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  publish:
    needs: test
    if: github.ref_type == 'tag'
    name: Publish to PyPI
    uses: ./.github/workflows/publish.yml
    secrets: inherit
