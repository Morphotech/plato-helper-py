[project]
name = "plato-helper-py"
version = "3.0.0"
description = "Helper for the Plato microservice"
authors = [
    {name = "Tiago Santos"},
    {name = "Joana Teixeira", email = "joana.teixeira@morphotech.com"},
    {name = "Le Hong Hieu"},
    {name = "Rita Mariquitos", email = "rita.mariquitos@morphotech.com"}
]
requires-python = ">=3.9,<4.0"
dependencies = [
    "requests>=2.27,<3.0",
    "backoff>=2.2,<3.0",
    "types-requests>=2.28.11,<3.0"
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.poetry.group.dev.dependencies]

# Static Typing
mypy = "^1.17"
mypy-extensions="^1.0.0"
typing-extensions="^4.3"

ruff = "^0.16"
coverage = ">=7.6.12,<7.16"
tox = ">=4.30.3,<4.61"
cyclonedx-bom = "^7.3"

[build-system]
requires = ["poetry-core>=1.2.0"]
build-backend = "poetry.core.masonry.api"
